[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Fork tests are excluded from the default run; see profile.fork.
no_match_path = "test/fork/**"
fs_permissions = [{ access = "read", path = "./abi" }, { access = "read-write", path = "./deployments" }]

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.fork]
no_match_path = "none/**"
match_path = "test/fork/**"

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 120

[lint]
# Perpl field names (CNS/PNS/LNS suffixes) must match its ABI.
exclude_lints = ["mixed-case-variable", "mixed-case-function"]
